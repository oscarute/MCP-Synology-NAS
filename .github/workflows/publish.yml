name: Publish

# Publishes oscarute/mcp-synology-nas to Docker Hub for amd64 and arm64:
# "latest" on every push to main, plus "1.2.3" and "1.2" for a v1.2.3 tag.
on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: oscarute/mcp-synology-nas

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=MCP Synology NAS
            org.opencontainers.image.description=MCP server for Synology DSM. Not affiliated with Synology Inc.

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: peter-evans/dockerhub-description@v5
        if: github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: MCP server for Synology DSM (File Station, Download Station, Container Manager and more)
          readme-filepath: ./README.md
